  <!-- Dark rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" stroke="#10b981" stroke-opacity="0.12" stroke-width="1"/>

  <!-- TM Monogram: T with upward arrow + M shape below -->
  <path d="M5,14 L12,14 L12,9.5 L16,5 L20,9.5 L20,14 L27,14 L27,17 L22,17 L22,26 L16,20.5 L10,26 L10,17 L5,17 Z" fill="url(#mark)"/>
