<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <title>TaxMind</title>
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="emeraldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Icon Mark: Emerald rounded square with white T+arrow -->
  <g transform="translate(3, 5)">
    <rect width="40" height="40" rx="10" fill="url(#emerald)"/>
    <path d="M6,17 L15,17 L15,12 L20,7 L25,12 L25,17 L34,17 L34,21 L25,21 L25,33 L15,33 L15,21 L6,21 Z" fill="white" fill-opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="50" y="33"
        font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" letter-spacing="-0.5">
    <tspan font-weight="600" fill="#e2e8f0">Tax</tspan><tspan font-weight="700" fill="url(#emeraldText)">Mind</tspan>
  </text>
</svg>